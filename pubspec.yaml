name: wobbly_wizards
description: Wobbly Wizards PEMORPG Flutter Web client.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_scene: ^0.24.3
  vector_math: ^2.1.4
  web_socket_channel: ^3.0.1
  http: ^1.2.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - flutter_scene_generated/
    - assets/models/
    - assets/textures/